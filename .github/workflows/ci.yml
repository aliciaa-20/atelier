name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build
        run: xcodebuild -scheme Atelier -configuration Debug build CODE_SIGNING_ALLOWED=NO

      # continue-on-error: the deployment target is macOS 27.0 (see CLAUDE.md),
      # and running (not just building) a macOS unit test bundle requires the
      # runner's actual host OS to be >= that target. GitHub-hosted runners
      # don't have a macOS 27 image yet (newest is macos-26 as of 2026-09-28)
      # -- de-hosting the test target from the app so it could use a lower
      # deployment target doesn't work either, since `@testable import
      # Atelier` still pulls in the app module's own 27.0-compiled interface.
      # Not fixable from this repo until GitHub ships a macOS 27 runner; the
      # Build step above still gates real compile regressions. Remove this
      # once `runs-on: macos-latest` actually resolves to macOS 27+.
      - name: Unit tests
        continue-on-error: true
        run: |
          xcodebuild test \
            -scheme Atelier \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build
        run: xcodebuild -scheme Atelier -configuration Debug build CODE_SIGNING_ALLOWED=NO

      - name: Unit tests
        run: |
          xcodebuild test \
            -scheme Atelier \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO
